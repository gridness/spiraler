name: Release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

# ASVS 13.3.2: building the app only needs read access to this repository.
permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
    steps:
      # ASVS 15.2.4: pin actions and install dependencies from their lockfiles.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin
          rustup default 1.97.1

      - name: Prepare release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          base = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          # ASVS 2.2.1: only numeric versions can reach filenames and cask Ruby.
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              raise SystemExit("The release base version must be major.minor.patch")
          major, minor, patch = map(int, base.split("."))
          version = f"{major}.{minor}.{patch + int(os.environ['GITHUB_RUN_NUMBER'])}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\nasset=Spiraler_{version}_aarch64.dmg\n")
          config = Path(os.environ["RUNNER_TEMP"]) / "release-config.json"
          config.write_text(json.dumps({"version": version}))
          PY

      - name: Install and check frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test src

      - name: Build unsigned Apple Silicon DMG
        run: |
          test "$(uname -m)" = arm64
          bun run tauri build --ci --no-sign --target aarch64-apple-darwin \
            --bundles app,dmg --config "$RUNNER_TEMP/release-config.json" -- --locked

      - name: Verify and stage DMG
        env:
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          lipo -verify_arch arm64 "$bundle/macos/Spiraler.app/Contents/MacOS/spiraler"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$bundle/macos/Spiraler.app/Contents/Info.plist")" = "$VERSION"
          hdiutil verify "$bundle/dmg/$ASSET"
          mkdir -p release
          cp "$bundle/dmg/$ASSET" "release/$ASSET"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      ASSET: ${{ needs.build.outputs.asset }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-dmg
          path: release

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json targetCommitish,isDraft > "$RUNNER_TEMP/existing-release.json"; then
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/existing-release.json")" = "$RELEASE_COMMIT"
            if test "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" = true; then
              gh release upload "$TAG" "release/$ASSET" --clobber
              gh release edit "$TAG" --draft=false
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Unsigned macOS build for Apple Silicon.

          Install with `brew install --cask gridness/oosama/spiraler`, or download the DMG below.
          macOS may require approval in System Settings > Privacy & Security because this build is not signed or notarized.
          NOTES
            gh release create "$TAG" "release/$ASSET" \
              --target "$RELEASE_COMMIT" --title "Spiraler $VERSION" \
              --draft --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release edit "$TAG" --draft=false
          fi
          # Reruns must hash the published asset, which can differ from a rebuild.
          gh release download "$TAG" --pattern "$ASSET" --dir published

      - name: Check GitHub App private key
        env:
          # ASVS 13.3.1: keep the app private key in Actions secrets.
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if test -z "$APP_PRIVATE_KEY"; then
            echo "::error::Set APP_PRIVATE_KEY to the GitHub App's PEM private key. The GitHub release was published successfully."
            exit 1
          fi

      - name: Create Homebrew GitHub App token
        id: homebrew-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23liat5k1xe9You0z0
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # ASVS 13.3.2: grant the installation token only tap Contents access.
          owner: gridness
          repositories: homebrew-oosama
          permission-contents: write

      - name: Check out Homebrew tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gridness/homebrew-oosama
          ref: main
          token: ${{ steps.homebrew-token.outputs.token }}
          path: homebrew-tap

      - name: Update Homebrew cask
        run: |
          # ASVS 11.4.1/11.4.3: Homebrew verifies the published DMG with SHA-256.
          sha256=$(sha256sum "published/$ASSET" | cut -d ' ' -f 1)
          cask=homebrew-tap/Casks/spiraler.rb
          if test -f "$cask"; then
            current=$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' "$cask")
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            if test -n "$current" && test "$newest" != "$VERSION"; then
              echo "A newer cask is already published; skipping this older run."
              exit 0
            fi
          fi
          mkdir -p homebrew-tap/Casks
          # ASVS 1.2.5: use quoted shell variables, never expression interpolation.
          cat > "$cask" <<EOF
          cask "spiraler" do
            version "$VERSION"
            sha256 "$sha256"

            url "https://github.com/$GH_REPO/releases/download/v#{version}/Spiraler_#{version}_aarch64.dmg"
            name "Spiraler"
            desc "Local asset studio for coherent visual families"
            homepage "https://github.com/$GH_REPO"

            depends_on arch: :arm64
            depends_on cask: "codex"

            app "Spiraler.app"

            caveats <<~EOS
              Spiraler is unsigned and not notarized. macOS may require approval
              in System Settings > Privacy & Security before the first launch.
              Sign in to Codex to generate images.
            EOS
          end
          EOF
          ruby -c "$cask"
          git -C homebrew-tap config user.name gridness
          git -C homebrew-tap config user.email 61116326+gridness@users.noreply.github.com
          git -C homebrew-tap add Casks/spiraler.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi
          git -C homebrew-tap commit -m "Updated Spiraler cask to $VERSION"
          # Rebase over unrelated tap updates without overwriting their commits.
          git -C homebrew-tap pull --rebase origin main
          git -C homebrew-tap push origin HEAD:main
