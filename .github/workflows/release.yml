name: Release desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

# ASVS 13.3.2: building the app only needs read access to this repository.
permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            machine: arm64
          # Ubuntu 22.04 keeps the Linux glibc baseline compatible with 22.04+.
          # Native ARM runners avoid emulation and AppImage cross-compilation.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            machine: x86_64
            deb_arch: amd64
            appimage_arch: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            machine: aarch64
            deb_arch: arm64
            appimage_arch: aarch64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
    steps:
      # ASVS 15.2.4: pin actions and install dependencies from their lockfiles.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
          test -x /usr/bin/xdg-open

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target "$TARGET"
          rustup default 1.97.1

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Prepare release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          base = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          # ASVS 2.2.1: only numeric versions can reach filenames and cask Ruby.
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              raise SystemExit("The release base version must be major.minor.patch")
          major, minor, patch = map(int, base.split("."))
          version = f"{major}.{minor}.{patch + int(os.environ['GITHUB_RUN_NUMBER'])}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\nasset=Spiraler_{version}_aarch64.dmg\n")
          config = Path(os.environ["RUNNER_TEMP"]) / "release-config.json"
          config.write_text(json.dumps({"version": version}))
          PY

      - name: Install and check frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test src
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build desktop bundles
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          MACHINE: ${{ matrix.machine }}
          # Cargo strips our binary. Leave bundled Linux system libraries intact.
          NO_STRIP: "true"
        run: |
          test "$(uname -m)" = "$MACHINE"
          # Sign the completed macOS bundle before Tauri creates its DMG.
          bun run tauri build --ci --target "$TARGET" \
            --bundles "$BUNDLES" --config "$RUNNER_TEMP/release-config.json" -- --locked

      - name: Verify and stage DMG
        if: runner.os == 'macOS'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          bash scripts/verify-macos-dmg.sh "$bundle/dmg/$ASSET" "$VERSION"
          mkdir -p release
          cp "$bundle/dmg/$ASSET" "release/$ASSET"

      - name: Verify and stage Linux packages
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          bundle="src-tauri/target/$TARGET/release/bundle"
          shopt -s nullglob
          debs=("$bundle"/deb/*_"$VERSION"_"$DEB_ARCH".deb)
          appimages=("$bundle"/appimage/*_"$VERSION"_*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          test "$(dpkg-deb --field "${debs[0]}" Architecture)" = "$DEB_ARCH"
          test "$(dpkg-deb --field "${debs[0]}" Version)" = "$VERSION"
          readelf -h "src-tauri/target/$TARGET/release/spiraler" | grep -F "$ELF_MACHINE"
          readelf -h "${appimages[0]}" | grep -F "$ELF_MACHINE"
          mkdir -p release
          cp "${debs[0]}" "release/Spiraler_${VERSION}_${DEB_ARCH}.deb"
          cp "${appimages[0]}" "release/Spiraler_${VERSION}_${APPIMAGE_ARCH}.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      ASSET: ${{ needs.build.outputs.asset }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json targetCommitish,isDraft > "$RUNNER_TEMP/existing-release.json"; then
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/existing-release.json")" = "$RELEASE_COMMIT"
            if test "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" = true; then
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --draft=false
            else
              # Preserve already-published bytes while adding any missing assets.
              gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published-assets.txt"
              for artifact in release/*; do
                if ! grep -Fxq "$(basename "$artifact")" "$RUNNER_TEMP/published-assets.txt"; then
                  gh release upload "$TAG" "$artifact"
                fi
              done
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          macOS build for Apple Silicon, ad-hoc signed and not notarized.
          Linux builds for x86_64 and ARM64, packaged as .deb and AppImage for Ubuntu 22.04 or newer.

          Install with `brew install --cask gridness/oosama/spiraler` on macOS or Linux.
          Linux also supports `brew install --formula gridness/oosama/spiraler` and the `spiraler` launcher.
          macOS requires first-launch approval in System Settings > Privacy & Security because this build is not notarized.
          On Linux, install the .deb with your package manager or make the AppImage executable and run it. Install and sign in to the Codex CLI to generate images.
          NOTES
            gh release create "$TAG" release/* \
              --target "$RELEASE_COMMIT" --title "Spiraler $VERSION" \
              --draft --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release edit "$TAG" --draft=false
          fi
          # Reruns must hash the published asset, which can differ from a rebuild.
          gh release download "$TAG" --pattern "$ASSET" --pattern '*.AppImage' --dir published

      - name: Check GitHub App private key
        env:
          # ASVS 13.3.1: keep the app private key in Actions secrets.
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if test -z "$APP_PRIVATE_KEY"; then
            echo "::error::Set APP_PRIVATE_KEY to the GitHub App's PEM private key. The GitHub release was published successfully."
            exit 1
          fi

      - name: Create Homebrew GitHub App token
        id: homebrew-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23liat5k1xe9You0z0
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # ASVS 13.3.2: grant the installation token only tap Contents access.
          owner: gridness
          repositories: homebrew-oosama
          permission-contents: write

      - name: Check out Homebrew tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gridness/homebrew-oosama
          ref: main
          token: ${{ steps.homebrew-token.outputs.token }}
          path: homebrew-tap

      - name: Update Homebrew cask and Linux formula
        env:
          GH_TOKEN: ${{ steps.homebrew-token.outputs.token }}
          APP_SLUG: ${{ steps.homebrew-token.outputs.app-slug }}
        run: |
          python3 scripts/update_homebrew.py "$VERSION" "$GH_REPO" published homebrew-tap
          ruby -c homebrew-tap/Casks/spiraler.rb
          ruby -c homebrew-tap/Formula/spiraler.rb
          # Attribute the commit to the same App that authenticates the push.
          bot_name="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot_name" --jq .id)
          git -C homebrew-tap config user.name "$bot_name"
          git -C homebrew-tap config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          git -C homebrew-tap add Casks/spiraler.rb Formula/spiraler.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew packages are already up to date."
            exit 0
          fi
          git -C homebrew-tap commit -m "Updated Spiraler cask and Linux formula to $VERSION"
          # Rebase over unrelated tap updates without overwriting their commits.
          git -C homebrew-tap pull --rebase origin main
          git -C homebrew-tap push origin HEAD:main

  verify-homebrew:
    needs: publish
    name: Verify Homebrew on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Install and launch the published Linux formula and cask
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # Runner images can have an older brew without Linux cask support.
          brew update
          brew tap gridness/oosama
          brew install --formula gridness/oosama/spiraler
          bash scripts/smoke-linux.sh "$(brew --prefix)/bin/spiraler"
          brew uninstall --formula gridness/oosama/spiraler
          brew install --cask gridness/oosama/spiraler
          bash scripts/smoke-linux.sh "$(brew --prefix)/bin/spiraler"
