[package]
name = "spiraler"
version = "0.1.0"
description = "A local asset studio for coherent visual families"
edition = "2021"
rust-version = "1.85"

[lib]
name = "spiraler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "rt-multi-thread", "macros"] }

[dev-dependencies]

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
# Backported gtk-rs-core#1343 while retaining Tauri's GTK 3 API compatibility.
glib = { path = "vendor/glib" }

[profile.release]
# Thin LTO and parallel code generation keep optimized builds cheaper to link.
lto = "thin"
codegen-units = 16
strip = true
